name: cleanup

# Deletes old handoff caches and untagged versions of the docker-build-cache
# and cache packages, see `.github/cleanup.sh`. Runs hourly, as the token can only send
# 1000 requests an hour: a backlog takes several runs, afterwards a run only
# reads a few pages.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Only list the versions to delete'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # the script stops after 45 minutes
    timeout-minutes: 55
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Delete old versions
        run: .github/cleanup.sh
        env:
          GH_TOKEN: ${{ github.token }}
          ORG: ${{ github.repository_owner }}
          # this repository needs the admin role on each of them
          PACKAGES: docker-build-cache cache
          DRY_RUN: ${{ inputs.dry-run || 'false' }}
          # in hours, for the handoff tags
          MAX_AGE: 24
          # in days, for untagged versions
          MAX_UNTAGGED_AGE: 7
